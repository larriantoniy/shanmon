services:
  nginx:
    build: .
    container_name: site-nginx
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: site-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
